  - name: autres
    label: "Autres pages (contact, premium…)"
    type: collection
    path: src/pages
    filename: "{primary}.md"
    fields:
      - { name: title, label: "Titre de la page", type: string, required: true }
      - { name: layout, label: "Mise en page (ne pas changer)", type: string, default: page.njk, hidden: true }
      - { name: permalink, label: "Adresse de la page (ex. /ma-page/)", type: string, required: true }
      - { name: chapo, label: "Phrase d'introduction", type: text }
      - { name: body, label: "Contenu de la page", type: rich-text }

  - name: reglages
    label: "Coordonnées et réseaux"
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: nom, label: "Nom", type: string }
      - { name: metier, label: "Métier (sous le nom)", type: string }
      - { name: presentation, label: "Présentation en une phrase", type: text }
      - { name: url, label: "Adresse du site (quand vous aurez un nom de domaine)", type: string }
      - { name: contact_email, label: "E-mail de contact", type: string }
      - { name: contact_telephone, label: "Téléphone", type: string }
      - { name: facebook, label: "Lien de la page Facebook", type: string }
      - { name: youtube, label: "Lien de la chaîne YouTube", type: string }
      - { name: instagram, label: "Lien Instagram", type: string }
